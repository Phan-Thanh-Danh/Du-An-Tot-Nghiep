server {
    listen 80;
    server_name localhost;
    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/lms.pem;
    ssl_certificate_key /etc/nginx/certs/lms-key.pem;

    client_max_body_size 500M;

    # Define MIME types for CSS, JS, WASM, and other assets
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/wasm wasm;
        image/svg+xml svg svgz;
        image/jpeg jpg jpeg;
        image/png png;
        image/gif gif;
        image/webp webp;
        font/woff2 woff2;
        font/woff woff;
        font/ttf ttf;
        application/font-sfnt otf;
        application/json json;
    }
    default_type application/octet-stream;

    # index.html luôn được kiểm tra lại để user nhận bản JS mới sau mỗi deploy
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Asset đã hash tên file -> cache dài hạn
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    location /api/ {
        proxy_pass http://backend:5097/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/hubs/ {
        proxy_pass http://backend:5097/api/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
