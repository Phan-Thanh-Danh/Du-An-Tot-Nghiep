version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Test@123_PassWord!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - SeedProfile=LargeDemo
      # Overriding the default connection string to point to the sqlserver container
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LMS;User Id=sa;Password=Test@123_PassWord!;TrustServerCertificate=True;
      # R2 Storage
      - R2Storage__AccountId=87934b0fb36afe0a6b19db75efc7fe24
      - R2Storage__Endpoint=https://87934b0fb36afe0a6b19db75efc7fe24.r2.cloudflarestorage.com
      - R2Storage__AccessKeyId=872e796be9c27223e4d2b7fe48afd75e
      - R2Storage__SecretAccessKey=46a0c09da41ff2f0a7cc7aacad3bb8ed6c418eb4530617862c860d248bf2e28b
      - R2Storage__BucketName=aet-lms-media
      - R2Storage__PublicDomain=https://pub-05926a5122ef4b4791e652fd76c73072.r2.dev
      # PayOS
      - PayOS__ClientId=e996915a-86cd-4ac4-8cf8-4a77986670af
      - PayOS__ApiKey=e57d0543-b6c9-4f2a-984b-0c592c85a802
      - PayOS__ChecksumKey=3418ca3cb045db5f8203f2a0b53618bb09e028050554472853a67559c95cf1da
      - PayOS__ReturnUrl=https://192.168.137.157/payment/success
      - PayOS__CancelUrl=https://192.168.137.157/payment/cancel
      - PayOS__BaseUrl=https://api-merchant.payos.vn
      # Ollama AI
      - Ollama__BaseUrl=http://100.93.200.42:11434
      - Ollama__ChatModel=qwen2.5:3b
      - Ollama__ReasoningModel=qwen3.5:9b-q4_K_M
      - Ollama__EmbeddingModel=qwen3-embedding:0.6b
      - Ollama__ContextLength=4096
      - Ollama__MaxOutputTokens=2048
      - Ollama__TimeoutSeconds=180
    ports:
      - "5597:5097"
    depends_on:
      - sqlserver

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the local certs folder to Nginx container so it can serve HTTPS
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    entrypoint: ["turnserver", "-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  sqlserver_data:
