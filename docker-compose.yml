version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${LMS_SQL_SA_PASSWORD:?LMS_SQL_SA_PASSWORD must be set in local .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__Secret=${JwtSettings__Secret:?JwtSettings__Secret must be set in local .env}
      - SeedProfile=LargeDemo
      # Overriding the default connection string to point to the sqlserver container
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LMS;User Id=sa;Password=${LMS_SQL_SA_PASSWORD:?LMS_SQL_SA_PASSWORD must be set in local .env};TrustServerCertificate=True;
      # R2 Storage
      - R2Storage__AccountId=87934b0fb36afe0a6b19db75efc7fe24
      - R2Storage__Endpoint=https://87934b0fb36afe0a6b19db75efc7fe24.r2.cloudflarestorage.com
      - R2Storage__AccessKeyId=${R2Storage__AccessKeyId:?R2Storage__AccessKeyId must be set in local .env}
      - R2Storage__SecretAccessKey=${R2Storage__SecretAccessKey:?R2Storage__SecretAccessKey must be set in local .env}
      - R2Storage__BucketName=aet-lms-media
      - R2Storage__PublicDomain=https://pub-05926a5122ef4b4791e652fd76c73072.r2.dev
      # PayOS
      - PayOS__ClientId=${PayOS__ClientId:?PayOS__ClientId must be set in local .env}
      - PayOS__ApiKey=${PayOS__ApiKey:?PayOS__ApiKey must be set in local .env}
      - PayOS__ChecksumKey=${PayOS__ChecksumKey:?PayOS__ChecksumKey must be set in local .env}
      - PayOS__ReturnUrl=https://192.168.137.157/payment/success
      - PayOS__CancelUrl=https://192.168.137.157/payment/cancel
      - PayOS__BaseUrl=https://api-merchant.payos.vn
      # Ollama AI
      - Ollama__BaseUrl=http://100.93.200.42:11434
      - Ollama__ChatModel=qwen2.5:3b
      - Ollama__ReasoningModel=qwen3.5:9b-q4_K_M
      - Ollama__EmbeddingModel=qwen3-embedding:0.6b
      - Ollama__ContextLength=4096
      - Ollama__MaxOutputTokens=2048
      - Ollama__TimeoutSeconds=180
    ports:
      - "5097:5097"
    depends_on:
      - sqlserver

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the local certs folder to Nginx container so it can serve HTTPS
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    entrypoint: ["turnserver", "-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  sqlserver_data:
