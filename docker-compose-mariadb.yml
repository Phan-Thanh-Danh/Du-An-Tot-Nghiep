version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=Test@123_PassWord!
      - MYSQL_DATABASE=lms
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - SeedProfile=LargeDemo
      # Pointing to the mariadb container in this stack
      - ConnectionStrings__DefaultConnection=Server=mariadb;Port=3306;Database=lms;Uid=root;Pwd=Test@123_PassWord!;
      # R2 Storage
      - R2Storage__AccountId=87934b0fb36afe0a6b19db75efc7fe24
      - R2Storage__Endpoint=https://87934b0fb36afe0a6b19db75efc7fe24.r2.cloudflarestorage.com
      - R2Storage__AccessKeyId=872e796be9c27223e4d2b7fe48afd75e
      - R2Storage__SecretAccessKey=46a0c09da41ff2f0a7cc7aacad3bb8ed6c418eb4530617862c860d248bf2e28b
      - R2Storage__BucketName=aet-lms-media
      - R2Storage__PublicDomain=https://pub-05926a5122ef4b4791e652fd76c73072.r2.dev
      # PayOS
      - PayOS__ClientId=e996915a-86cd-4ac4-8cf8-4a77986670af
      - PayOS__ApiKey=e57d0543-b6c9-4f2a-984b-0c592c85a802
      - PayOS__ChecksumKey=3418ca3cb045db5f8203f2a0b53618bb09e028050554472853a67559c95cf1da
      - PayOS__ReturnUrl=https://192.168.137.157/payment/success
      - PayOS__CancelUrl=https://192.168.137.157/payment/cancel
      - PayOS__BaseUrl=https://api-merchant.payos.vn
    ports:
      - "5098:5097"
    depends_on:
      - mariadb

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command: turnserver -a -v -n -u test:test -r lms.local --no-dtls --no-tls

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  mariadb_data:
